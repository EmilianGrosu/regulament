<!DOCTYPE html>

<html lang='ro' dir='ltr'>
  <head>
    <meta charset='utf-8' />
    <meta name='viewport' content='width=device-width, initial-scale=1.0' />
    <link rel='stylesheet' href='style.css' />
    <script src='nui://game/ui/jquery.js' type='text/javascript'></script>
  </head>
  <body>
    <div class='eclipse left'></div>
    <div class='eclipse right'></div>
    <div class='container'>
      <div class='navbar'>
        <img src='logo.png' class='logo-img' />
        <h1 class='navbar-header'>Informații</h1>
        <img src='i.png' class='info-img' />
        <p class='navbar-desc'>
          Regulamentul este organizat pentru a explica clar ce este permis, ce este interzis și ce sancțiuni se pot aplica
        </p>
      </div>
      <div class='content'>
        <div class='content-toolbar'>
          <div class='content-nav'>
            <button id='regulament' class='active' data-action='regulament'>Regulament</button>
            <!-- <button id='tutoriale' data-action='tutoriale'>Tutoriale</button> -->
          </div>
          <div class='search-box'>
            <input id='info-search' type='text' autocomplete='off' placeholder='Căutați în regulament...' />
          </div>
        </div>
        <div class='content-container'>
          <div class='value'></div>
        </div>
      </div>
    </div>
    <script src='main.js' type='text/javascript'></script>
  </body>
</html>
